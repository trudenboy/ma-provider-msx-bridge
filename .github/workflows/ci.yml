name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: trudenboy/ma-server
          ref: dev
          path: ma-server
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: ma-server
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          source .venv/bin/activate
          uv pip install -e "."
          uv pip install -e ".[test]"
          uv pip install -r requirements_all.txt
      - name: Symlink provider
        run: |
          rm -rf "$GITHUB_WORKSPACE/ma-server/music_assistant/providers/msx_bridge"
          ln -s "$GITHUB_WORKSPACE/provider/msx_bridge" \
                "$GITHUB_WORKSPACE/ma-server/music_assistant/providers/msx_bridge"
      - name: Run unit tests
        run: |
          source ma-server/.venv/bin/activate
          pytest tests/ -v --ignore=tests/integration --tb=short -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: trudenboy/ma-server
          ref: dev
          path: ma-server
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        working-directory: ma-server
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e "."
          uv pip install -e ".[test]"
          uv pip install -r requirements_all.txt
      - name: Symlink provider
        run: |
          rm -rf "$GITHUB_WORKSPACE/ma-server/music_assistant/providers/msx_bridge"
          ln -s "$GITHUB_WORKSPACE/provider/msx_bridge" \
                "$GITHUB_WORKSPACE/ma-server/music_assistant/providers/msx_bridge"
      - name: Lint
        run: |
          source ma-server/.venv/bin/activate
          ruff check provider/ tests/
          ruff format --check provider/ tests/
      - name: Type check
        run: |
          source ma-server/.venv/bin/activate
          mypy provider/ --ignore-missing-imports
