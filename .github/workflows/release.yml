name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (semver, e.g. 1.2.0)"
        required: true
        type: string
      prerelease:
        description: "Pre-release?"
        type: boolean
        default: false

jobs:
  release:
    uses: trudenboy/ma-provider-tools/.github/workflows/reusable-release.yml@main
    with:
      manifest_path: provider/msx_bridge/manifest.json
      provider_path: provider/msx_bridge/

      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}

