site_name: MSX Bridge Provider for Music Assistant
site_url: https://trudenboy.github.io/ma-provider-msx-bridge/
repo_url: https://github.com/trudenboy/ma-provider-msx-bridge
repo_name: trudenboy/ma-provider-msx-bridge
edit_uri: edit/feat/msx-bridge-player-provider/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Development:
      - Setup: development.md
      - Docker: dev-docker.md
      - Testing: testing.md
      - Contributing: contributing.md
      - Incident Management: incident-management.md
